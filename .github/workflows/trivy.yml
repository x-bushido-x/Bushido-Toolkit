name: Trivy Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  scan-filesystem:
    name: Scan Python code
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          exit-code: '0'

      - name: Upload FS results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'filesystem-scan'

  scan-docker:
    name: Scan Docker image
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Dockerfile
        run: |
          echo 'FROM python:3.9-slim' > Dockerfile
          echo 'WORKDIR /app' >> Dockerfile
          echo 'COPY requirements.txt .' >> Dockerfile
          echo 'RUN pip install --no-cache-dir -r requirements.txt' >> Dockerfile
          echo 'COPY . .' >> Dockerfile
          echo 'CMD ["python", "Bushido.py"]' >> Dockerfile
      
      - name: Build Docker image
        run: docker build -t bushidotoolkit:latest .
      
      - name: Run Trivy Docker scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bushidotoolkit:latest'
          format: 'sarif'
          output: 'trivy-docker-results.sarif'
          exit-code: '0'

      - name: Upload Docker results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-docker-results.sarif'
          category: 'docker-image-scan'
